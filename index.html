// S.ctx = {list:[{s:songId, it:itemId|null}], colId, pos}: the list the current song was opened from
function ctxEntry(){return S.ctx?S.ctx.list[S.ctx.pos]||null:null}
// the open song's list changed (moved, added, synced from another device): follow the list's new order
function syncCtx(){
  if(!S.ctx||!S.ctx.colId)return;const c=Store.cols.get(S.ctx.colId);if(!c)return;
  const cur=ctxEntry();if(!cur||!cur.it)return;const sl=songItems(c),p=sl.findIndex(x=>x.i===cur.it);if(p<0)return;
  S.ctx={...S.ctx,list:sl.map(x=>({s:x.s,it:x.i})),pos:p};
}
function itemById(colId,iid){const c=colId&&Store.cols.get(colId);return c&&iid?itemsOf(c).find(x=>x.i===iid)||null:null}
function ctxItem(){const e=ctxEntry();return e&&e.s===S.songId?itemById(S.ctx.colId,e.it):null}
// transposition is remembered per list position (a list may want another key) or per song
function trSlot(s){const it=ctxItem();return it&&s.id===S.songId?'i:'+it.i:s.id}
function defShift(s){const it=s.id===S.songId?ctxItem():null;return it&&it.key?keyShift(baseKey(s),it.key):0}
// only a transposition the player chose is stored; the list's own key is worked out fresh every time,
// so it stays right when the song's or the list's key changes later
function curShift(s){
  const v=S.tr[trSlot(s)];
  return v==null?defShift(s):v;
}
function ctxStep(d){
  if(!S.ctx) return -1;
  for(let p=S.ctx.pos+d;p>=0&&p<S.ctx.list.length;p+=d) if(Store.songs.has(S.ctx.list[p].s)) return p;
  return -1;
}
function ctxInfo(){
  const e=ctxEntry();if(!e||e.s!==S.songId) return null;
  const alive=S.ctx.list.filter(x=>Store.songs.has(x.s));
  const pi=ctxStep(-1),ni=ctxStep(1);
  const nx=ni>=0?S.ctx.list[ni]:null,next=nx?Store.songs.get(nx.s):null;
  return {i:alive.indexOf(e),n:alive.length,prev:pi>=0?Store.songs.get(S.ctx.list[pi].s):null,next,
    nextKey:next?itemKey(itemById(S.ctx.colId,nx.it),next):'',col:S.ctx.colId?Store.cols.get(S.ctx.colId):null,it:ctxItem()};
}
let lastDetailKey='';
function renderDetail(force=false){
  saveState();
  const d=$('#detail');
  if(S.edit){return}
  document.body.classList.remove('editing');
  if(S.cueMode){renderCueSheet();return}
  const s=S.songId&&Store.songs.get(S.songId);
  if(!s){
    lastDetailKey='';
    d.innerHTML=`<div class="dempty"><div class="empty"><h3>${Store.songs.size?'Διάλεξε τραγούδι':'Ξεκίνα τη βιβλιοθήκη σου'}</h3><p>${Store.songs.size?'Ή πρόσθεσε ένα καινούργιο με επικόλληση από το kithara.':'Επικόλλησε το πρώτο σου τραγούδι. Τίτλος, καλλιτέχνης και ακόρντα αναγνωρίζονται αυτόματα.'}</p><div class="acts"><button class="btn primary" data-act="newsong">${ic('plus','sm')}Νέο τραγούδι</button></div></div></div>`;
    renderPbar();return;
  }
  const n=curShift(s);
  const cx=ctxInfo();const it=cx&&cx.it;
  const key=s.id+'|'+s.updatedAt+'|'+n+'|'+(S.ctx?S.ctx.colId+'@'+S.ctx.pos+'/'+S.ctx.list.length:'')+'|'+(it?it.key+'~'+it.note:'')+'|'+(cx&&cx.col?cx.col.updatedAt:'')+'|'+S.perf+'|'+(S.fromCue||'')+(S.returnTo?'r':'');
  if(!force&&key===lastDetailKey){renderPbar();return}
  const keep=d.scrollTop;const sameSong=lastDetailKey.split('|')[0]===s.id;
  lastDetailKey=key;
  const flat=preferFlat(s,n);
  const chips=[];
  const hasLines=(s.lines||[]).length>0; // without lyrics the key is shown big instead (.bigkey)
  if(hasLines&&s.key) chips.push(`<span class="chip key">Τόνος <b>${esc(trKey(s.key,n,flat))}</b>${n?` <span>(το τραγούδι είναι σε ${esc(s.key)})</span>`:''}</span>`);
  else if(hasLines&&it&&it.key) chips.push(`<span class="chip key">Τόνος <b>${esc(it.key)}</b></span>`);
  if(s.capo) chips.push(`<span class="chip">Κάπο <b>${esc(s.capo)}</b></span>`);
  if(s.rhythm) chips.push(`<span class="chip">Ρυθμός <b>${esc(s.rhythm)}</b></span>`);
  (s.genres||[]).forEach(g=>chips.push(`<span class="chip">${esc(g)}</span>`));
  const hasC=songHasChords(s);
  // on stage: one thin line on top — the way back, the title, the key (tap it to change)
  const shownKey=hasC&&s.key?trKey(s.key,n,flat):itemKey(it,s);
  // one way out, top left, the same on every screen: «‹ Λίστα» (or «‹ Πίσω» for a song played on its own)
  const back=S.returnTo?`<button class="shback" data-act="stageback">${ic('left','sm')}Πίσω</button>`:S.fromCue?`<button class="shback" data-act="cueback">${ic('left','sm')}Λίστα</button>`:`<button class="shback" data-act="perfx" aria-label="Έξοδος από τη σκηνή">${ic('left','sm')}${cx&&cx.col?'Λίστα':'Πίσω'}</button>`;
  d.innerHTML=`<div class="dwrap">
    <div class="stagehead">${back}<div class="shtitle"><b>${esc(s.title||'Χωρίς τίτλο')}</b>${s.artist?`<span>${esc(s.artist)}</span>`:''}</div>${shownKey?`<button class="shkey" ${hasC?'data-act="stagepop" data-sheet="key"':''} aria-label="Τόνος ${esc(shownKey)}">${esc(shownKey)}</button>`:''}</div>
    ${cx&&cx.col?`<div class="ctxbar"><button class="ctxname" data-act="sec" data-sec="col:${cx.col.id}" title="Πίσω στη λίστα">${ic(cx.col.ordered?'listmusic':'folder','sm')}<span>${esc(cx.col.name)}</span></button><span class="pos">${cx.i+1}/${cx.n}</span>${it?`<button class="btn sm ghost ctxedit" data-act="itemmenu" data-item="${it.i}" data-col="${cx.col.id}" title="Τόνος και σημείωση σε αυτή τη λίστα" aria-label="Τόνος και σημείωση σε αυτή τη λίστα">${ic('settings','sm')}<span>Τόνος/σημείωση</span></button>`:''}</div>`:''}
    <div class="dtop">
      <button class="ibtn back" data-act="back" aria-label="Πίσω">${ic('left')}</button>
      <div class="dtitle"><h1>${esc(s.title||'Χωρίς τίτλο')}</h1>${s.artist?`<div class="ar">${esc(s.artist)}</div>`:''}</div>
      <div class="dacts">
        <button class="ibtn" data-act="edit" title="Επεξεργασία" aria-label="Επεξεργασία">${ic('pencil')}</button>
        <button class="ibtn" data-act="songmenu" title="Περισσότερα" aria-label="Περισσότερα">${ic('more')}</button>
      </div>
    </div>
    ${chips.length?`<div class="meta">${chips.join('')}</div>`:''}
    ${it&&it.note?`<div class="note inl"><span class="nl">${esc(cx.col.name)}</span>${esc(it.note)}</div>`:''}
    ${s.notes?`<div class="note"><span class="nl">Σημειώσεις</span>${esc(s.notes)}</div>`:''}
    ${!(s.lines||[]).length?`<div class="nolyr">

function fitStage(sh){
  if(!sh||!S.perf)return;
  sh.classList.remove('cols2');fitFs=0;
  if(prefs.fit===false||innerWidth<768){sh.style.setProperty('--fs',prefs.fs+'px');return}
  const base=22;sh.style.setProperty('--fs',base+'px');
  sh.classList.add('measure');const w=Math.max(1,...[...sh.querySelectorAll('.ln')].map(l=>l.getBoundingClientRect().width));sh.classList.remove('measure');
  const W=sh.clientWidth;const fit=cw=>Math.round(Math.max(18,Math.min(44,base*.9*cw/w)));
  let fs=fit(W);sh.style.setProperty('--fs',fs+'px');
  const box=sh.closest('.splitR')||$('#detail');
  if(innerWidth>=1000&&sh.scrollHeight>box.clientHeight-120){
    sh.classList.add('cols2');const gap=parseFloat(getComputedStyle(sh).columnGap)||48;
    const fs2=fit((W-gap)/2);

    if(fs2>=base){fs=fs2;sh.style.setProperty('--fs',fs+'px')}else sh.classList.remove('cols2');
  }
  fitFs=fs;
}

let prevT;
function updatePreview(){
  const E=S.edit;if(!E) return;
  const r=parseText(E.text);
  const tmp=Object.assign({},E.draft,{lines:r.lines});
  const p=$('#edPrev');
  if(p) p.innerHTML=r.lines.length?`<div class="sheet" style="--fs:17px">${sheetHTML(tmp,0)}</div>`:`<div class="muted">Η προεπισκόπηση εμφανίζεται εδώ, με τα ακόρντα πάνω από τις συλλαβές τους.</div>`;
  const info=$('#parseInfo');
  if(info){
    const parts=[];
    if(r.lines.length) parts.push(`${r.lines.filter(l=>l.k==='l').length} γραμμές`);
    if(r.chordLines) parts.push(`${r.chordLines} με ακόρντα`);
    const g=guessKey(r.lines);
    if(g&&!E.touchedKey) parts.push(`προτεινόμενος τόνος ${g}`);
    let html=parts.map(esc).join(' · ');
    if(r.unknown.length) html+=` <span class="warn">Έλεγξε: ${r.unknown.slice(0,6).map(esc).join(', ')}</span>`;
    info.innerHTML=html;
  }
  if(!E.touchedKey){const g=guessKey(r.lines);const sel=$('#edKey');if(sel&&g&&!E.draft.key){sel.value=g}}
}
function editorInput(e){
  const E=S.edit;if(!E) return;const t=e.target;
  if(t.id==='edBody'){E.text=t.value;E.dirty=true;clearTimeout(prevT);prevT=setTimeout(updatePreview,140);return}
  const k=t.dataset.k;if(!k) return;
  E.dirty=true;
  if(k==='key'){E.draft.key=t.value;E.touchedKey=true}
  else E.draft[k]=t.value;
}
function editorPaste(e){
  const E=S.edit;if(!E||e.target.id!=='edBody') return;
  const wasEmpty=!E.text.trim();
  setTimeout(()=>{
    const ta=$('#edBody');E.text=ta.value;E.dirty=true;
    if(wasEmpty){
      const {meta,body}=extractMeta(E.text);const filled=[];
      if(meta.title&&!E.draft.title){E.draft.title=meta.title;$('#edTitle').value=meta.title;filled.push('τίτλο')}
      if(meta.artist&&!E.draft.artist){E.draft.artist=meta.artist;$('#edArtist').value=meta.artist;filled.push('καλλιτέχνη')}
      if(meta.key&&!E.draft.key&&ALLKEYS.includes(meta.key)){E.draft.key=meta.key;E.touchedKey=true;$('#edKey').value=meta.key;filled.push('τόνο')}
      if(meta.rhythm&&!E.draft.rhythm){E.draft.rhythm=meta.rhythm;$('#edRhythm').value=meta.rhythm;filled.push('ρυθμό')}
      if(meta.capo&&!E.draft.capo){E.draft.capo=meta.capo;$('#edCapo').value=meta.capo;filled.push('κάπο')}
      if(Object.keys(meta).length){E.text=body;ta.value=body}
      if(filled.length){const f=filled.length>1?filled.slice(0,-1).join(', ')+' και '+filled[filled.length-1]:filled[0];toast('Συμπλήρωσα '+f+' από το κείμενο. Έλεγξέ τα.')}
    }
    updatePreview();
  },0);
}
async function saveEditor(){
  const E=S.edit;if(!E) return;
  const err=$('#edErr');
  const ng=$('#edNewGenre');if(ng&&ng.value.trim()) addGenre(ng.value.trim());
  const title=(E.draft.title||'').trim();
  if(!title){err.textContent='Γράψε τίτλο για να αποθηκευτεί.';$('#edTitle').focus();return}
  const r=parseText(E.text);
  const s=Object.assign({},E.draft,{title,artist:(E.draft.artist||'').trim(),lines:r.lines});
  delete s.tags;delete s.credits; // fields that no longer exist: dropped from a song when it is saved
  if(!s.key&&!E.touchedKey){s.key=guessKey(r.lines)}
  const sel=$('#edKey');if(sel) s.key=sel.value||s.key;
  const isNew=!E.id;
  if(isNew){s.id=uid();s.createdAt=now();s.fav=false}
  try{
    if(!isNew&&E.orig) await Store.addVersion(E.orig).catch(()=>{});
    const p=Store.saveSong(s);
    const intoCol=S.edit&&S.edit.intoCol;
    S.edit=null;S.songId=s.id;
    // a new song goes into the list that was open when it was started (a folder holds lists, not songs)
    if(isNew){const col=intoCol&&Store.cols.get(intoCol);if(col&&!isFolder(col)&&!hasSong(col,s.id)){const c=clone(col);c.items=itemsOf(c).concat({i:uid(),s:s.id});Store.saveCol(c)}}
    if(!S.ctx||!S.ctx.list.some(x=>x.s===s.id)){const list=playList();S.ctx={list,colId:colOf(S.sec)?S.sec.slice(4):null,pos:Math.max(0,list.findIndex(x=>x.s===s.id))}}
    renderList(false);renderDetail(true);
    await p;toast(isNew?'Το τραγούδι προστέθηκε':'Αποθηκεύτηκε');
  }catch(e){toast(e&&e.code==='quota_exceeded'?'Η βάση γέμισε. Σβήσε παλιές εκδόσεις ή τραγούδια.':'Δεν αποθηκεύτηκε. Δοκίμασε ξανά.');console.warn(e)}
}
function addGenre(g){const E=S.edit;if(!E) return;E.draft.genres=E.draft.genres||[];if(!E.draft.genres.includes(g))E.draft.genres.push(g);E.dirty=true}

function guardEdit(fn){
  const E=S.edit;if(!E||!E.dirty){fn();return}

}
function cancelEditor(force){
  const E=S.edit;if(!E) return;
  if(E.dirty&&!force){confirmDlg('Απόρριψη αλλαγών;','Οι αλλαγές που δεν αποθηκεύτηκαν θα χαθούν.','Απόρριψη',()=>cancelEditor(true));return}

function modalExit(m){
  if(m.hidden||reduceMotion()||!m.querySelector('.dlg'))return;
  const g=m.cloneNode(true);g.removeAttribute('id');g.hidden=false;g.className='modalghost';g.setAttribute('aria-hidden','true');g.inert=true;
  g.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));document.body.appendChild(g);

/* =====================================================================
   IMPORT: «Live Setlist» html (shows → programs → packs → {title, artist, key, note})
     show    → folder collection
     program → ordered list (cue mode), its notes → list notes
     pack    → section inside the list (when the program has more than one)
     song    → one library song per title; key/note → this position's own key/note
   ===================================================================== */
const lsFold=s=>String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/ς/g,'σ').replace(/['’΄`]/g,'').replace(/\s+/g,' ').trim();
// same key the Live Setlist app uses for its lyrics
function lsLyrKey(t){const s=lsFold(t).replace(/[^\p{L}\p{N}]+/gu,' ').trim();let h=0x811c9dc5;for(const ch of s){h^=ch.codePointAt(0);h=Math.imul(h,16777619)>>>0}return'l'+h.toString(36)+s.length.toString(36)}
const lsId=(p,id)=>(p+String(id||uid())).replace(/[^A-Za-z0-9-]/g,'-').slice(0,64);
const lsKeyOf=k=>{k=String(k||'').trim();return k&&k!=='—'&&k!=='-'?k.replace(/^H/,'B'):''};
function lsParse(html){
  const m=String(html).match(/<script[^>]*id=["']setlist-data["'][^>]*>([\s\S]*?)<\/script>/i);
  if(!m) throw new Error('format');
  const d=JSON.parse(m[1]);if(!d||!Array.isArray(d.shows)) throw new Error('format');
  return d;
}
function lsPlan(d){
  const lyrics=d.lyrics||{};
  // 1. group every occurrence by title (and by artist when two artists share a title)
  const groups=new Map();
  const occ=[];
  for(const sh of d.shows) for(const pr of sh.programs||[]) for(const pk of pr.packs||[]) for(const x of pk.songs||[]){
    const title=String(x.title||'').trim();if(!title) continue;
    const o={title,artist:String(x.artist||'').trim(),key:lsKeyOf(x.key),note:String(x.note||'').trim()};occ.push(o);
    const f=lsFold(title);if(!groups.has(f))groups.set(f,[]);groups.get(f).push(o);
  }
  const lib=new Map();for(const s of Store.songs.values()){const f=lsFold(s.title);if(!lib.has(f))lib.set(f,[]);lib.get(f).push(s)}
  const newSongs=[];let matched=0,withLyrics=0;
  for(const [f,list] of groups){
    const artists=[...new Set(list.map(o=>o.artist).filter(Boolean))];
    const parts=artists.length>1?artists.map(a=>list.filter(o=>o.artist===a)):[list];
    if(artists.length>1) parts[0].push(...list.filter(o=>!o.artist));
    for(const part of parts){
      const artist=part.find(o=>o.artist)?.artist||'';
      const have=(lib.get(f)||[]).find(s=>!artist||!s.artist||lsFold(s.artist)===lsFold(artist));
      let song=have;
      if(have) matched++;
      else{
        const cnt={};part.forEach(o=>{if(o.key)cnt[o.key]=(cnt[o.key]||0)+1});
        const key=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]||'';
        const ly=lyrics[lsLyrKey(part[0].title)];
        const lines=ly?parseText(String(ly)).lines:[];if(lines.length)withLyrics++;
        song={id:uid(),title:part[0].title,artist,key:ALLKEYS.includes(key)?key:'',genres:[],rhythm:'',timeSig:'',capo:'',notes:'',lines,fav:false,createdAt:now(),updatedAt:now()};
        newSongs.push(song);
      }
      part.forEach(o=>o.song=song);
    }
  }
  // 2. folders and lists
  const cols=[];let positions=0,replaced=0,k=0;
  for(const sh of d.shows){
    const fid=lsId('ls-',sh.id);if(Store.cols.has(fid))replaced++;
    cols.push({id:fid,name:String(sh.name||'Εμφάνιση').trim(),ordered:false,mode:'cue',parent:null,items:[],notes:'',createdAt:now()});
    for(const pr of sh.programs||[]){
      const id=lsId('ls-',pr.id);if(Store.cols.has(id))replaced++;
      const packs=pr.packs||[];const items=[];
      for(const pk of packs){
        if(packs.length>1) items.push(Object.assign({i:uid(),sec:String(pk.name||'Πακέτο').trim()},pk.sub?{sub:String(pk.sub).trim()}:{}));
        for(const x of pk.songs||[]){
          if(!String(x.title||'').trim()) continue;
          const o=occ[k++];positions++;   // same walk order as step 1
          const it={i:uid(),s:o.song.id};
          if(o.key&&o.key!==o.song.key) it.key=o.key;   // also keeps free-text keys like «C/Am» on the position
          if(o.note) it.note=o.note;
          items.push(it);
        }
      }
      const notes=Array.isArray(pr.notes)?pr.notes.map(String).join('\n'):String(pr.notes||'');
      cols.push({id,name:String(pr.name||'Πρόγραμμα').trim(),ordered:true,mode:'cue',parent:fid,items,notes,createdAt:now()});
    }
  }
  return {songs:newSongs,cols,stats:{shows:d.shows.length,programs:cols.length-d.shows.length,positions,newSongs:newSongs.length,matched,withLyrics,replaced}};
}

// list: [{s:songId,it:itemId|null}] to open within (or omit to stay in the current list); pos: position in it
function openSong(id,list,colId,pos){
  if(S.edit){S.edit=null}
  S.cueMode=false;
  S.songId=id;
  if(list) S.ctx={list,colId:colId||null,pos:pos!=null?pos:Math.max(0,list.findIndex(x=>x.s===id))};
  else if(S.ctx){
    if(pos!=null) S.ctx.pos=pos;
    else if(!ctxEntry()||ctxEntry().s!==id){const p=S.ctx.list.findIndex(x=>x.s===id);if(p>=0)S.ctx.pos=p;else S.ctx=null}
  }
  const s=Store.songs.get(id);
  // «Πρόσφατα»: on GitHub this stays on the device, so opening a song never makes a commit
  if(s&&(!s.openedAt||now()-s.openedAt>120000)){const n=clone(s);n.openedAt=now();Store.songs.set(id,n);if(Store.mode==='github')Store._saveCache();else Store._write('songs',n).catch(()=>{})}
  if(document.body.dataset.size!=='l') setPane('detail');
  renderRows();renderDetail(true);
  $('#detail').scrollTop=0;
}
function go(delta){
  if(!ctxInfo()) return;
  const p=ctxStep(delta>0?1:-1);if(p<0) return;
  openSong(S.ctx.list[p].s,null,null,p);
}

let wakeLock=null,wakeWarned=false;
let nsVideo=null;
async function requestWake(){
  if(prefs.keepAwake===false)return false;
  try{if('wakeLock' in navigator&&window.isSecureContext){wakeLock=await navigator.wakeLock.request('screen');return true}}catch(e){}
  // fallback for browsers without the Wake Lock API (older iPads): a tiny silent looping video keeps the screen on
  try{
    if(!nsVideo){nsVideo=document.createElement('video');nsVideo.setAttribute('playsinline','');nsVideo.setAttribute('muted','');nsVideo.muted=true;nsVideo.loop=true;nsVideo.setAttribute('aria-hidden','true');nsVideo.style.cssText='position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:0;top:0';nsVideo.src='data:video/mp4;base64,'+NOSLEEP;document.body.appendChild(nsVideo)}
    await nsVideo.play();return true;
  }catch(e){}
  if(!wakeWarned){wakeWarned=true;setTimeout(()=>toast('Η οθόνη μπορεί να σβήσει. Αύξησε τον χρόνο αδράνειας στις ρυθμίσεις της συσκευής.'),900)}
  return false;
}
document.addEventListener('visibilitychange',()=>{if(S.perf&&document.visibilityState==='visible'&&wakeLock===null)requestWake()});

  S.perf=true;document.body.classList.add('perf');document.body.classList.remove('uihidden');

  try{const el=document.documentElement;el.requestFullscreen&&el.requestFullscreen().catch(()=>{})}catch(e){}
  renderDetail(true);$('#detail').focus({preventScroll:true});
}
function exitPerf(){
  closePop();
  const wasCue=S.cueMode;
  if(S.split){S.split=false;document.body.classList.remove('stagesplit');S.songId=null}
  S.perf=false;S.cueMode=false;S.fromCue=null;S.returnTo=null;if(wasCue&&document.body.dataset.size!=='l')setPane('list');document.body.classList.remove('perf','uihidden');
  try{wakeLock&&wakeLock.release&&wakeLock.release()}catch(e){}wakeLock=null;try{nsVideo&&nsVideo.pause()}catch(e){}
  try{document.fullscreenElement&&document.exitFullscreen().catch(()=>{})}catch(e){}
  applyTheme();renderDetail(true);
}

document.addEventListener('click',e=>{
  // a tap outside a stage panel closes it (and does nothing else, so the lyrics don't hide the bar)
  if(popKind&&!e.target.closest('#pop')&&!e.target.closest('[data-act=stagepop]')&&!e.target.closest('.shkey')){closePop();if(!e.target.closest('[data-act]'))return}
  // a tap outside the open drawer closes it
  if(document.body.classList.contains('sideopen')&&!e.target.closest('#side')&&!e.target.closest('[data-act=sidetoggle]')){document.body.classList.remove('sideopen');return}
  const el=e.target.closest('[data-act]');
  if(el){
    if(el.closest('.handle')) return;
    const f=A[el.dataset.act];
    if(f){e.preventDefault();f(el,e)}
    return;
  }
  if(S.perf&&e.target.closest('#detail')&&!e.target.closest('button')) document.body.classList.toggle('uihidden');
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q=e.target.value;renderRows();return}
  if(e.target.id==='sq'){S.q=e.target.value;renderSearchResults();return}
  if(S.edit&&e.target.closest('.ed')) editorInput(e);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.pref){prefs[t.dataset.pref]=t.checked;savePrefs(); // device preferences (Ρυθμίσεις, stage ⋯, Aa)
    applyStagePrefs();
    if(t.dataset.pref==='keepAwake'&&S.perf){if(t.checked)requestWake().then(()=>refreshSheet());else{try{wakeLock&&wakeLock.release&&wakeLock.release()}catch(e){}wakeLock=null;try{nsVideo&&nsVideo.pause()}catch(e){}refreshSheet()}}
    if(t.dataset.pref==='fit'&&S.perf){S.cueMode?renderCueSheet():renderDetail(true);drawPop()}
    return}
  if(t.dataset.f){S.f[t.dataset.f]=t.value;renderList(true);return}
  if(t.hasAttribute('data-sort')){S.sort=t.value;renderRows();return}
  if(S.edit&&t.id==='edKey') editorInput(e);
});
document.addEventListener('paste',editorPaste);
document.addEventListener('keydown',e=>{
  const t=e.target;const typing=t.matches&&t.matches('input,textarea,select');
  if(t.id==='edNewGenre'&&e.key==='Enter'){e.preventDefault();const v=t.value.trim();if(v){addGenre(v);t.value='';const wrap=$('#edGenres');const b=document.createElement('button');b.type='button';b.className='tog on';b.dataset.act='tgGenre';b.dataset.g=v;b.textContent=v;wrap.insertBefore(b,t)}return}
  if(e.key==='Escape'){if(popKind){closePop();return}if(!$('#modal').hidden){closeModal();return}if(S.perf&&S.returnTo){A.stageback();return}if(S.perf&&S.fromCue&&!S.cueMode){A.cueback();return}if(S.perf){exitPerf();return}if(S.edit){cancelEditor(false);return}}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&S.edit){e.preventDefault();saveEditor();return}
  if(typing||!$('#modal').hidden) return;
  if(e.key==='/'){const q=$('#q');if(q&&q.offsetParent){e.preventDefault();q.focus()}return}
  // drag keyboard reorder
  if(t.classList&&t.classList.contains('handle')&&e.altKey&&(e.key==='ArrowUp'||e.key==='ArrowDown')){e.preventDefault();moveItem(t.dataset.drag,e.key==='ArrowUp'?-1:1);return}
  if(t.matches&&t.matches('.row,[role=button][data-act]')&&e.key==='Enter'){t.click();return}
  // stage list: Enter opens the lyrics (a focused button keeps its own Enter), arrows/pedal move
  if(S.cueMode&&S.split){ // tablet: the pedal pages through the lyrics on the right, then goes on to the next song
    const R=$('.splitR');const dn=['PageDown','ArrowDown',' '].includes(e.key),upk=['PageUp','ArrowUp'].includes(e.key);
    if(e.key==='ArrowRight'){e.preventDefault();cueMove(1)}else if(e.key==='ArrowLeft'){e.preventDefault();cueMove(-1)}
    else if(dn&&R){e.preventDefault();if(R.scrollTop+R.clientHeight>=R.scrollHeight-4)cueMove(1);else R.scrollTop+=Math.round(R.clientHeight*.8)}
    else if(upk&&R){e.preventDefault();if(R.scrollTop<=4)cueMove(-1);else R.scrollTop-=Math.round(R.clientHeight*.8)}
    return}
  if(S.cueMode){if(e.key==='Enter'){if(t.closest&&t.closest('button,a'))return;e.preventDefault();A.cueopen();return}if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();cueMove(1)}else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();cueMove(-1)}return}
  if(!S.songId||S.edit) return;
  // page turner / pedal: down pages through the song and, at its end, goes on to the next one; up does the reverse
  const d=$('#detail');
  const down=e.key==='PageDown'||e.key==='ArrowDown'||(e.key===' '&&S.perf);
  const up=e.key==='PageUp'||e.key==='ArrowUp';
  if(e.key==='ArrowRight'){e.preventDefault();go(1)}
  else if(e.key==='ArrowLeft'){e.preventDefault();go(-1)}
  else if(down){e.preventDefault();if(d.scrollTop+d.clientHeight>=d.scrollHeight-4){if(ctxStep(1)>=0)go(1)}else d.scrollTop+=Math.round(d.clientHeight*.8)}
  else if(up){e.preventDefault();if(d.scrollTop<=4){if(ctxStep(-1)>=0){go(-1)}}else d.scrollTop-=Math.round(d.clientHeight*.8)}
});

// ---- drag to reorder ----
function moveItem(id,delta,quiet){
  const c=colOf(S.sec);if(!c) return false;const n=clone(c);const items=itemsOf(n);const i=items.findIndex(x=>x.i===id);const j=i+delta;if(i<0||j<0||j>=items.length) return false;
  const [moved]=items.splice(i,1);items.splice(j,0,moved);
  // keyboard (Alt+↑/↓) keeps focus on the drag handle; ▲▼ taps (quiet) handle focus and scroll themselves
  const fh=()=>{if(quiet)return;const h=document.querySelector(`.handle[data-drag="${id}"]`);h&&h.focus()};
  Store.saveCol(n).then(fh,()=>toast('Δεν αποθηκεύτηκε.'));
  setTimeout(fh,30);return true;
}
// ▲▼: the song you are moving stays under your finger (the list scrolls by the same amount),
// so tapping ▲ again keeps moving the same song; the neighbour it swapped with slides to its new place.
function flipMove(id,delta){
  const list0=$('#list');if(!list0){moveItem(id,delta);return}
  // every row that carries an item id (songs and pack headers), by its position on screen
  const rowOf=(L,k)=>[...L.querySelectorAll(`[data-item="${k}"]`)].find(e=>e.classList.contains('row')||!e.closest('button,.insgap'));
  const tops=L=>{const m=new Map();for(const e of L.querySelectorAll('[data-item]')){if(e.closest('button,.insgap')&&!e.classList.contains('row'))continue;const k=e.dataset.item;if(!m.has(k))m.set(k,e.getBoundingClientRect().top)}return m};
  const before=tops(list0),st=list0.scrollTop;
  if(!moveItem(id,delta,true))return;
  // the save redraws the list right away (as a new element that starts at the top)
  const L=$('#list');if(!L)return;L.scrollTop=st;
  const me=rowOf(L,id);if(me&&before.has(id))L.scrollTop+=me.getBoundingClientRect().top-before.get(id);
  const b=L.querySelector(`[data-act=${delta<0?'mvup':'mvdn'}][data-item="${id}"]`);b&&b.focus({preventScroll:true});
  if(reduceMotion())return;
  for(const [k,top] of before){if(k===id)continue;const e=rowOf(L,k);if(!e)continue;
    const d=top-e.getBoundingClientRect().top;if(Math.abs(d)>1)e.animate([{transform:`translateY(${d}px)`},{transform:'none'}],{duration:200,easing:'cubic-bezier(0.77, 0, 0.175, 1)'})}
}
let drag=null;
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest('.handle');if(!h) return;
  e.preventDefault();const row=h.closest('.row');const list=$('#list');
  drag={id:h.dataset.drag,row,list,startY:e.clientY,offset:0,pid:e.pointerId};
  row.classList.add('dragging');h.setPointerCapture(e.pointerId);
});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pid) return;
  const {row,list}=drag;
  const rows=[...list.querySelectorAll('.row')].filter(r=>r!==row);
  const y=e.clientY;
  let before=null;for(const r of rows){const b=r.getBoundingClientRect();if(y<b.top+b.height/2){before=r;break}}
  if(before!==row.nextSibling) list.insertBefore(row,before);
  const lb=list.getBoundingClientRect();if(y<lb.top+40)list.scrollTop-=8;else if(y>lb.bottom-40)list.scrollTop+=8;
});
document.addEventListener('pointerup',e=>{
  if(!drag||e.pointerId!==drag.pid) return;
  const {row,list}=drag;row.classList.remove('dragging');
  const order=[...list.querySelectorAll('.row[data-item]')].map(r=>r.dataset.item);drag=null;
  const c=colOf(S.sec);if(!c) return;
  const by=new Map(itemsOf(c).map(x=>[x.i,x]));
  const n=clone(c);n.items=order.filter(i=>by.has(i)).map(i=>by.get(i)).concat(itemsOf(c).filter(x=>!order.includes(x.i)));
  if(n.items.map(x=>x.i).join()!==itemsOf(c).map(x=>x.i).join()) Store.saveCol(n).catch(()=>toast('Δεν αποθηκεύτηκε η σειρά.'));
  else renderRows();
});
// the browser took the finger away (a call, a system gesture): drop the drag, keep the order as it was
document.addEventListener('pointercancel',e=>{
  if(!drag||e.pointerId!==drag.pid) return;
  drag.row.classList.remove('dragging');drag=null;renderRows();
});

/* =====================================================================
   BOOT
   ===================================================================== */
Store.onChange=what=>{
  if(drag) return;
  if(what==='status'){renderSide();return}
  if(what==='cols'||what==='all')syncCtx();
  renderSide();
  if(what==='cols'||what==='all'){
    const q=document.activeElement&&document.activeElement.id==='q';
    renderList(true);if(q){const el=$('#q');el.focus();el.setSelectionRange(el.value.length,el.value.length)}
  } else renderRows();
  if(S.cueMode) renderCueSheet(); else renderDetail(false);
  renderTabbar();
};
layout();applyTheme();applyStagePrefs();
if(window.innerWidth<760) document.body.dataset.pane='list';
renderAll();
// as soon as the device copy is loaded (before talking to GitHub), go back to where this device was
Store.onLocal=()=>{
  if(stateReady) return;
  const perf=restoreState();stateReady=true;
  renderAll();
  if(perf) enterPerf(); // back on stage (fullscreen may need a tap, the rest is there)
};
Store.init().then(()=>{
  stateReady=true;
  renderAll();
  if(Store.mode==='setup')ghModal();
});
// offline start: sw.js keeps a copy of the app (not of the songs: those stay with Store)
if('serviceWorker' in navigator&&window.isSecureContext&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn('sw',e)));
}
</script>
</body>
</html>
